name: Build, publish and release container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm config set audit false
          npm config set maxsockets 5
          if ! npm ci --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000; then
            cache_dir="$(npm config get cache)"
            find "${cache_dir}/_logs" -type f -name "*-debug-*.log" -print -exec tail -n 160 {} \;
            exit 1
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install CJK font for PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-droid-fallback

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  container:
    name: Publish container image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export tagged image
        if: startsWith(github.ref, 'refs/tags/v')
        id: export
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset_name="pdf-task-review-${RELEASE_TAG}-linux-amd64.tar.gz"
          docker pull "${IMAGE_NAME}:${RELEASE_TAG}"
          docker save "${IMAGE_NAME}:${RELEASE_TAG}" | gzip -9 > "${asset_name}"
          sha256sum "${asset_name}" > "${asset_name}.sha256"
          echo "asset=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Upload exported image artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.ref_name }}-linux-amd64
          path: |
            ${{ steps.export.outputs.asset }}
            ${{ steps.export.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Task Review ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.export.outputs.asset }}
            ${{ steps.export.outputs.asset }}.sha256
